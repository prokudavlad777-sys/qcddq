# ===== Аирдроп =====
# Автоматический сброс каждые N минут (0 — выключить автосброс)
interval-minutes: 30
# Сколько минут груз лежит на земле, потом исчезает
lifetime-minutes: 15
# Автосброс не срабатывает, если онлайн меньше игроков
min-players: 1
# Максимум одновременных аирдропов
max-active: 3

# Мир и область, где падает груз (случайная точка в кольце вокруг центра)
world: world
center-x: 0
center-z: 0
min-radius: 300
max-radius: 1500

# Падение: стартовая высота над землёй и скорость (блоков в тик)
fall-height: 100
fall-speed: 0.3

messages:
  prefix: "<gradient:#ffb300:#ff6f00><bold>АИРДРОП</bold></gradient> <dark_gray>»</dark_gray> "
  incoming: "{prefix}<white>Над миром пролетел самолёт и сбросил груз! Координаты: <yellow>X: {x}, Z: {z}</yellow> <gray>({world})</gray>"
  landed: "{prefix}<green>Груз приземлился!</green> <white>Координаты: <yellow>X: {x}, Y: {y}, Z: {z}</yellow>. Успей забрать!"
  looted: "{prefix}<gray>Аирдроп на <yellow>X: {x}, Z: {z}</yellow> полностью разграблен.</gray>"
  expired: "{prefix}<gray>Аирдроп на <yellow>X: {x}, Z: {z}</yellow> пропал.</gray>"
  failed: "{prefix}<red>Не удалось найти подходящее место для аирдропа.</red>"
  too-many: "{prefix}<red>Уже активно максимальное число аирдропов.</red>"
  only-player: "{prefix}<red>Эта команда доступна только игроку.</red>"
  reloaded: "{prefix}<green>Конфиг перезагружен.</green>"
  usage: "{prefix}<gray>Использование: <white>/drop</white> — случайная точка, <white>/drop here</white> — над вами, <white>/drop reload</white>.</gray>"

# Содержимое большого сундука: номер слота 0-53 (9 в ряду, 6 рядов сверху вниз).
